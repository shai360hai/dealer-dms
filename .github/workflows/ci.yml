name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Schema and access rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema (twice, to prove it's re-runnable) and seed
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase-stub.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - name: Check access rules
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/access-rules.sql
